name: Build sideload APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build debug APK (sideload-signed)
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK for release
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/sway_meditation.apk

      - name: Verify APK metadata matches build.gradle
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}"
          if [[ -f local.properties ]]; then
            SDK="$(sed -n 's|^sdk.dir=||p' local.properties | tr -d '\r' | sed 's|\\\\|/|g')"
          fi
          AAPT="$(find "$SDK/build-tools" -name aapt -type f 2>/dev/null | sort -V | tail -n1)"
          if [[ -z "$AAPT" ]]; then
            echo "::error::aapt not found under $SDK/build-tools"
            exit 1
          fi
          GRADLE_CODE="$(sed -n 's/.*versionCode *= *\([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)"
          GRADLE_NAME="$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          BADGING="$("$AAPT" dump badging app/build/outputs/apk/debug/sway_meditation.apk)"
          APK_CODE="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" <<<"$BADGING")"
          APK_NAME="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" <<<"$BADGING")"
          echo "Gradle: versionCode=$GRADLE_CODE versionName=$GRADLE_NAME"
          echo "APK:    versionCode=$APK_CODE versionName=$APK_NAME"
          if [[ "$APK_CODE" != "$GRADLE_CODE" || "$APK_NAME" != "$GRADLE_NAME" ]]; then
            echo "::error::APK metadata does not match app/build.gradle.kts"
            exit 1
          fi

      - name: Compute local APK SHA256 (build artifact only)
        id: apk_hash
        run: |
          SHA256=$(sha256sum app/build/outputs/apk/debug/sway_meditation.apk | awk '{print $1}')
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "Local build SHA256: $SHA256"
          echo "Do not use this hash in release/version.json until verified against the live GitHub download."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sway_meditation
          path: app/build/outputs/apk/debug/sway_meditation.apk

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/debug/sway_meditation.apk

      - name: Verify live release asset matches upload
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          REPO="${{ github.repository }}"
          APK_URL="https://github.com/${REPO}/releases/download/${TAG}/sway_meditation.apk"
          tmp_apk="$(mktemp -t sway-live.XXXXXX.apk)"
          trap 'rm -f "$tmp_apk"' EXIT

          echo "Waiting for release asset propagation..."
          sleep 10

          echo "Downloading live release asset: $APK_URL"
          downloaded=false
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --retry 3 --retry-delay 2 \
              -H "Accept: application/octet-stream" \
              -H "User-Agent: serene-interval-release-verify" \
              -o "$tmp_apk" "$APK_URL"; then
              size="$(wc -c <"$tmp_apk" | tr -d ' ')"
              if [[ "$size" -gt 1048576 ]]; then
                downloaded=true
                break
              fi
            fi
            echo "Attempt $attempt failed; retrying..."
            sleep 5
          done

          if [[ "$downloaded" != true ]]; then
            echo "::warning::Could not download live release asset; run publish-release.ps1 to pin version.json."
            exit 0
          fi

          LIVE_SHA="$(sha256sum "$tmp_apk" | awk '{print $1}')"
          LOCAL_SHA="${{ steps.apk_hash.outputs.sha256 }}"
          echo "Live GitHub SHA256: $LIVE_SHA"
          echo "Local build SHA256: $LOCAL_SHA"
          if [[ "$LIVE_SHA" != "$LOCAL_SHA" ]]; then
            echo "::error::Live release asset hash differs from CI build. Use the live hash in release/version.json."
            exit 1
          fi
          echo "::notice::CI upload verified. Pin manifest with: ./release/publish-release.ps1 -PinManifestOnly"
          echo "::notice::Then run ./release/pre-deploy-check.ps1 before merging release/version.json to main."
          echo "::notice::Use SHA256 $LIVE_SHA in release/version.json (from live GitHub download)."
