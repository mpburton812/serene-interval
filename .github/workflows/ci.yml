name: CI

on:
  push:
    branches:
      - dev
      - test
      - main
  pull_request:
    branches:
      - dev
      - test
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      version_json: ${{ steps.filter.outputs.version_json }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            version_json:
              - 'release/version.json'

  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Ensure local.properties for Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "sdk.dir=$SDK" > local.properties
          if [[ -n "${{ secrets.ONENOTE_CLIENT_ID }}" ]]; then
            echo "onenote.clientId=${{ secrets.ONENOTE_CLIENT_ID }}" >> local.properties
            echo "OneNote client ID injected for this build"
          else
            echo "ONENOTE_CLIENT_ID secret not set; OneNote sync disabled in this build"
          fi
          echo "Using Android SDK at $SDK"

      - name: Run unit tests and lint
        run: bash scripts/run-tests.sh --unit --lint

  verify-release-manifest:
    needs: changes
    if: needs.changes.outputs.version_json == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Self-test manifest verifier
        run: bash release/verify-manifest.sh --self-test

      - name: Verify release manifest hash against live APK
        run: bash release/verify-manifest.sh release/version.json
